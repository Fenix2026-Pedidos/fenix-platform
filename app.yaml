runtime: python312

instance_class: F1

automatic_scaling:
  min_instances: 0
  max_instances: 3

entrypoint: gunicorn -b :$PORT fenix.wsgi

# Los secretos se recuperan en tiempo de arranque desde Secret Manager,
# siempre dentro del proyecto GCP de Fenix.
env_variables:
  DEBUG: "false"
  LOAD_GCP_SECRETS: "true"
  USE_SQLITE_DEV: "false"
  SECURE_SSL_REDIRECT: "true"
  ALLOWED_HOSTS: "fenixdelamancha.es,www.fenixdelamancha.es,.appspot.com"
  DEFAULT_FROM_EMAIL: "Fenix <noreply@fenixdelamancha.es>"
  RESEND_DEFAULT_FROM: "Fenix <noreply@fenixdelamancha.es>"

handlers:
- url: /static
  static_dir: staticfiles
  secure: always

- url: /.*
  script: auto
  secure: always
